[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sworldmodel"
version = "0.1.0"
description = "A general, reality-first social world model: forecasts come only from simulated actor trajectories inside a verified persistent world."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "SWORLDMODEL-CORE" }]
# Intentionally zero runtime dependencies: the canonical kernel is stdlib-only so
# it runs from a clean install, offline, deterministically. Provider/research
# backends are pluggable and only the *live* ones need network + credentials.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8", "ruff>=0.5"]

[project.scripts]
sworldmodel = "sworldmodel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sworldmodel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.11"
files = ["src/sworldmodel"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
# Tests use fixtures/monkeypatching; keep strictness on the library only.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter; long evidence strings are fine

[tool.ruff.lint.isort]
known-first-party = ["sworldmodel"]
